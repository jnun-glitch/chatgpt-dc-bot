name: Bot CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r _inner_bot/requirements.txt pytest
      - name: Compile Python files
        run: python -m compileall -q _inner_bot
      - name: Run tests
        run: pytest -q
      - name: Import smoke test
        env:
          PYTHONPATH: _inner_bot
        run: python -c "import bot; print('bot import OK')"
