name: Bot CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12']
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: _inner_bot/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r _inner_bot/requirements.txt pytest

      - name: Compile Python files
        run: python -m compileall -q _inner_bot

      - name: Run tests
        env:
          PYTHONPATH: _inner_bot
        run: pytest -q

      - name: Import smoke test
        env:
          PYTHONPATH: _inner_bot
        run: python -c "import bot; print('bot import OK')"
